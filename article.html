                <h1 class="article-title">关于扶光与日语学习的二三事</h1>
            </header>

            <section class="article-content">
                <p>你好，我是扶光的站长。很高兴能在这里与你相遇。</p>

                <p>学习一门语言，就像是打开了一扇通往新世界的大门。比如，日语中最具代表性的词汇：
                    <ruby>木漏れ日<rt>こもれび</rt></ruby>。
                </p>

                <p>它的意思是“从树叶缝隙间倾泻下来的阳光”。这种细腻的表达，正是我们在学习
                    <ruby>日本語<rt>にほんご</rt></ruby> 时，最能感受到的文化底蕴。
                </p>

                <blockquote>
                    <p>“语言的边界，就是我们世界的边界。”</p>
                </blockquote>
            </section>

        </article>
