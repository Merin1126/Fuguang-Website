<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扶光日语 - 极简便当盒 UI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="fuguang-navbar">
        <div class="nav-left"></div>
        <div class="nav-center">
            <a href="#" class="circle-logo"><i class="fa-solid fa-sun"></i></a>
        </div>
        <div class="nav-right">
            <a href="#" class="login-btn">登录</a>
        </div>
    </nav>

    <main>
        <section class="home-main">

            <div class="hero-section">
                <h1>👇 见证终极复合魔法 👇</h1>
                <p>将鼠标悬停在下方卡片上测试扫光与变白特效...</p>
            </div>

            <div class="home-search-wrapper">
                <div class="home-search">

                    <div class="search-mode-toggle">
                        <div class="toggle-track">
                            <span class="toggle-label active"><i class="fas fa-link"></i> 关联搜索</span>
                            <span class="toggle-label"><i class="fas fa-crosshairs"></i> 精准搜索</span>
                            <div class="toggle-thumb"></div>
                        </div>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" placeholder="搜索单词、文章…" class="search-input" autocomplete="off">
                        <button class="search-clear"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="search-dropdown">
                        <div class="dropdown-section">
                            <div class="dropdown-header">
                                <span><i class="fas fa-history"></i> 搜索历史</span>
                                <button class="clear-btn">清除全部</button>
                            </div>
                            <ul class="dropdown-list">
                                <li><a href="#">です的用法</a></li>
                                <li><a href="#">N3 文法</a></li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>

            <div class="fuguang-grid-container">
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-seedling"></i></div>
                    <h2>入门</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
                    <h2>单词</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-pen-nib"></i></div>
                    <h2>语法</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                    <h2>测试</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-laptop-code"></i></div>
                    <h2>练习</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-door-open"></i></div>
                    <h2>随机传送</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-tv"></i></div>
                    <h2>日本新闻</h2>
                </a>
                <a href="#" class="fuguang-card">
                    <div class="card-icon"><i class="fa-solid fa-chess-rook"></i></div>
                    <h2>城镇中心</h2>
                </a>
            </div>

        </section>
    </main>

    <div style="height: 1000px;"></div>

    <nav class="fuguang-bottom-nav">
        <ul class="bottom-nav-list">
            <li class="nav-item">
                <button class="nav-btn"><i class="fa-solid fa-bars"></i><span>菜单</span></button>
            </li>
            <li class="nav-item">
                <button class="nav-btn"><i class="fa-solid fa-search"></i><span>搜索</span></button>
            </li>
            <li class="nav-item">
                <button class="nav-btn">
                    <div class="icon-wrapper">
                        <i class="fa-regular fa-heart"></i>
                        <span class="badge">98</span>
                    </div>
                    <span>喜欢</span>
                </button>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-btn"><i class="fa-solid fa-user"></i><span>账号</span></a>
            </li>
        </ul>
    </nav>

    <script>
        // 1. 简单的搜索框切换逻辑
        const toggle = document.querySelector('.search-mode-toggle');
        const thumb = document.querySelector('.toggle-thumb');
        const labels = document.querySelectorAll('.toggle-label');

        toggle.addEventListener('click', () => {
            // 切换滑块位置
            const isActive = thumb.style.transform === 'translateX(100%)';
            thumb.style.transform = isActive ? 'translateX(0)' : 'translateX(100%)';

            // 切换文字高亮
            labels.forEach(l => l.classList.toggle('active'));
        });

        // 2. 输入框聚焦显示下拉菜单
        const input = document.querySelector('.search-input');
        const dropdown = document.querySelector('.search-dropdown');
        const clearBtn = document.querySelector('.search-clear');

        input.addEventListener('focus', () => {
            dropdown.style.display = 'block';
        });

        input.addEventListener('input', () => {
            clearBtn.style.display = input.value ? 'block' : 'none';
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            input.focus();
        });

        // 点击页面其他地方关闭下拉菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.home-search')) {
                dropdown.style.display = 'none';
            }
        });
    </script>

</body>

</html>
